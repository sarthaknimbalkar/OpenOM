name: release

# Tag-triggered publish (#137): push a v* tag to publish the Python packages to PyPI and openom-js
# to npm. Uses API-TOKEN auth - set two repo secrets: PYPI_API_TOKEN and NPM_TOKEN. The publish
# steps skip cleanly when a secret is absent (so a tag pushed before secrets are set, or for a
# release already published out of band, no-ops instead of failing), and skip a version that already
# exists. Bump the pyproject.toml / package.json versions BEFORE tagging; make the tag match.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [core, cli, mcp]
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build ${{ matrix.pkg }} --outdir dist
      - name: Publish to PyPI (API token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  npm:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build + publish openom-js
        if: ${{ env.NPM_TOKEN != '' }}
        working-directory: js
        run: |
          npm ci
          npm publish --access public || echo "openom-js@$(node -p "require('./package.json').version") already published; skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
