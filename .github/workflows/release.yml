name: release

# Tag-triggered publish (#137): push a v* tag to publish the Python packages to PyPI and openom-js
# to npm. Uses API-TOKEN auth (no PyPI Trusted-Publisher config required) - set two repo secrets
# first: PYPI_API_TOKEN (an account- or project-scoped PyPI token) and NPM_TOKEN (an npm automation
# token). Deterministic, inference-free packages. Bump versions in the pyproject.toml / package.json
# BEFORE tagging, and make the tag match (v0.1.0 -> version 0.1.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [core, cli, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build ${{ matrix.pkg }} --outdir dist
      - name: Publish to PyPI (API token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build + publish openom-js
        working-directory: js
        run: |
          npm ci
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
