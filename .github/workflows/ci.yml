name: ci

# The gate ([OM-VEC-002]) — full jobs defined below. Trigger is MANUAL (workflow_dispatch): run
# it from the Actions tab or `gh workflow run ci.yml`. (Push/PR auto-triggers are intentionally
# disabled; the job code is unchanged so re-enabling is a one-line edit.)
#   on:
#     push: { branches: [main, "feat/**"] }
#     pull_request: { branches: [main] }

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_js: ${{ steps.check.outputs.has_js }}
      has_py: ${{ steps.check.outputs.has_py }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          test -f js/package.json && echo "has_js=true" >> "$GITHUB_OUTPUT" || echo "has_js=false" >> "$GITHUB_OUTPUT"
          test -f core/pyproject.toml && echo "has_py=true" >> "$GITHUB_OUTPUT" || echo "has_py=false" >> "$GITHUB_OUTPUT"

  python:
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + cli + mcp (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e "core[dev]" -e "cli[dev]" -e "mcp[dev]"
      - name: ruff
        run: ruff check core/src core/tests core/scripts cli/src cli/tests mcp/src mcp/tests spec/matrix.py spec/__init__.py spec/tests
      - name: mypy
        run: |
          mypy core/src
          mypy cli/src
          mypy mcp/src
          mypy spec/matrix.py
      - name: pytest (core, coverage gate)
        run: pytest core -q --cov=openom_core --cov-report=term-missing --cov-fail-under=90
      - name: pytest (cli, coverage gate)
        run: pytest cli -q --cov=openom_cli --cov-report=term-missing --cov-fail-under=90
      - name: pytest (mcp, coverage gate)
        run: pytest mcp -q --cov=openom_mcp --cov-report=term-missing --cov-fail-under=85
      - name: pytest (spec matrix)
        run: python -m pytest spec/tests -q
      - name: fixture matrix — pathology axis (§B.3, [OM-DoD-001](e))
        run: python -m spec.matrix --assert-synthetic

  boundary:
    # Cardinal rule: NO inference anywhere in core/cli/mcp. core+cli are additionally
    # network-free; /mcp may carry a network client (M3's explicit fetch, §M) but never inference.
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: core + cli — no inference AND no network client
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core -e cli
          inference='openai|anthropic|cohere|langchain|llama-index|transformers|torch|tensorflow|onnxruntime|sentence-transformers'
          network='requests|httpx|httpx2|aiohttp|urllib3'
          if pip freeze | grep -iE "^($inference|$network)==" ; then
            echo "::error::inference/network client leaked into the network-free core/cli tree"
            exit 1
          fi
          echo "core/cli: deterministic + network-free"
      - name: mcp — no inference (network is permitted for the explicit fetch, §M)
        shell: bash
        run: |
          pip install -c constraints.lock -e mcp
          inference='openai|anthropic|cohere|langchain|llama-index|transformers|torch|tensorflow|onnxruntime|sentence-transformers'
          if pip freeze | grep -iE "^($inference)==" ; then
            echo "::error::inference client leaked into /mcp"
            exit 1
          fi
          echo "mcp: inference-free"

  drift:
    # Regenerating the JCS vectors must be a no-op; a diff means a hash silently moved.
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core
      - name: Regenerate vectors and assert no drift
        shell: bash
        run: |
          python core/scripts/gen_vectors.py
          git diff --exit-code -- spec/vectors/expected spec/vectors/payloads spec/vectors/rejections \
            || (echo "::error::vector regeneration is not a no-op — a canonical hash moved"; exit 1)

  sbom:
    # Software Bill of Materials for the deterministic tree (supply-chain audit, §M).
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core + cli + cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core -e cli cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  javascript:
    needs: detect
    if: needs.detect.outputs.has_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck + lint + coverage js
        working-directory: js
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run coverage

  cross-impl:
    # The anti-fork oracle: each implementation reads the other's golden PDFs.
    needs: [detect, python, javascript]
    if: needs.detect.outputs.has_js == 'true' && needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install both toolchains
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e "core[dev]"
          cd js && npm ci && npm run build
      - name: JS side — read Track A goldens (A->B) + emit JS-embedded PDFs (B->A)
        run: node js/scripts/crossimpl.mjs "$RUNNER_TEMP/ximpl"
      - name: Python side — read JS-embedded PDFs (B->A) + byte-identity
        run: pytest core -q -m cross_impl
        env:
          OPENOM_XIMPL_DIR: ${{ runner.temp }}/ximpl

  extension-gate:
    # [OM-DoD-006] + [OM-DoD-007] — the LIVE proof of the MV3 extension. Real headed Chromium loads the
    # unpacked extension against a self-signed HTTPS harness and drives: consumer mode (every §AA badge
    # state + §Y publish HMAC) AND author mode (capture→review→assert→embed, reprice, and the
    # [OM-PRIV-001] egress-zero assertion via an injected fake LanguageModel). `test:consumer` runs both
    # the consumer and author Playwright specs. Mocked unit tests cannot prove this: they stayed green
    # while a pdf.js-worker and an ajv-`new Function` (CSP) defect each broke the product in-browser.
    # This job — not test:unit — is the gate (repo Rule 5: real fixtures, no mocks).
    needs: [detect, javascript]
    if: needs.detect.outputs.has_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install /js + /extension deps
        run: |
          cd js && npm ci
          cd ../extension && npm ci
      - name: Install xvfb + Playwright Chromium (+ OS deps)
        working-directory: extension
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium
      - name: Consumer gate — headed MV3 Chromium under xvfb (builds eval-free bundle first)
        working-directory: extension
        run: xvfb-run -a npm run test:consumer
      - name: Assert the built consumer bundle is inference-free (cardinal rule)
        working-directory: extension
        run: node scripts/assert-no-inference.mjs dist
