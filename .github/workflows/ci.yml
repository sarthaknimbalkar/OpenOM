name: ci

# The gate ([OM-VEC-002], #110) - full jobs defined below. MANUAL by design: this workflow runs only
# when dispatched (Actions tab or `gh workflow run ci.yml`), NOT automatically on push/PR. The
# deterministic invariants (no-inference boundary, JCS drift, cross-impl anti-fork oracle, python/js
# suites, the openom-embed Action) are verified LOCALLY before pushing - see CONTRIBUTING.md
# "Verification gates" - and this workflow reproduces them on demand. Auto-triggers are intentionally
# off (repo owner runs gates manually); re-add a `push:`/`pull_request:` block here to restore them.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_js: ${{ steps.check.outputs.has_js }}
      has_py: ${{ steps.check.outputs.has_py }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          test -f js/package.json && echo "has_js=true" >> "$GITHUB_OUTPUT" || echo "has_js=false" >> "$GITHUB_OUTPUT"
          test -f core/pyproject.toml && echo "has_py=true" >> "$GITHUB_OUTPUT" || echo "has_py=false" >> "$GITHUB_OUTPUT"

  python:
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + cli + mcp (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e "core[dev]" -e "cli[dev]" -e "mcp[dev]"
      - name: ruff
        run: ruff check core/src core/tests core/scripts cli/src cli/tests mcp/src mcp/tests spec/matrix.py spec/__init__.py spec/tests spec/scripts
      - name: mypy
        run: |
          mypy core/src
          mypy cli/src
          mypy mcp/src
          mypy spec/matrix.py
      - name: pytest (core, coverage gate)
        run: pytest core -q --cov=openom_core --cov-report=term-missing --cov-fail-under=90
      - name: pytest (cli, coverage gate)
        run: pytest cli -q --cov=openom_cli --cov-report=term-missing --cov-fail-under=90
      - name: pytest (mcp, coverage gate)
        run: pytest mcp -q --cov=openom_mcp --cov-report=term-missing --cov-fail-under=85
      - name: pytest (spec matrix)
        run: python -m pytest spec/tests -q
      - name: fixture matrix - pathology axis (§B.3, [OM-DoD-001](e))
        run: python -m spec.matrix --assert-synthetic

  boundary:
    # Cardinal rule: NO inference anywhere in core/cli/mcp. core+cli are additionally
    # network-free; /mcp may carry a network client (M3's explicit fetch, §M) but never inference.
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: core + cli - no inference AND no network client
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core -e cli
          inference='openai|anthropic|cohere|langchain|llama-index|transformers|torch|tensorflow|onnxruntime|sentence-transformers'
          network='requests|httpx|httpx2|aiohttp|urllib3'
          if pip freeze | grep -iE "^($inference|$network)==" ; then
            echo "::error::inference/network client leaked into the network-free core/cli tree"
            exit 1
          fi
          echo "core/cli: deterministic + network-free"
      - name: mcp - no inference (network is permitted for the explicit fetch, §M)
        shell: bash
        run: |
          pip install -c constraints.lock -e mcp
          inference='openai|anthropic|cohere|langchain|llama-index|transformers|torch|tensorflow|onnxruntime|sentence-transformers'
          if pip freeze | grep -iE "^($inference)==" ; then
            echo "::error::inference client leaked into /mcp"
            exit 1
          fi
          echo "mcp: inference-free"

  drift:
    # Regenerating the JCS vectors must be a no-op; a diff means a hash silently moved.
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core
      - name: Regenerate vectors + fuzz corpus and assert no drift
        shell: bash
        run: |
          python core/scripts/gen_vectors.py
          python core/scripts/gen_fuzz_corpus.py
          git diff --exit-code -- spec/vectors/expected spec/vectors/payloads spec/vectors/rejections spec/vectors/fuzz \
            || (echo "::error::vector/fuzz regeneration is not a no-op - a canonical hash moved"; exit 1)
      - name: Regenerate the hosted namespace tree and assert no drift (#139)
        shell: bash
        run: |
          python spec/scripts/gen_site.py
          git diff --exit-code -- site \
            || (echo "::error::site/ is stale vs spec/ - run: python spec/scripts/gen_site.py"; exit 1)

  sbom:
    # Software Bill of Materials for the deterministic tree (supply-chain audit, §M).
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core + cli + cyclonedx
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core -e cli cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  vuln-scan:
    # Supply-chain gate (#121): the SBOM records deps; this FAILS the build on a known vulnerability.
    # Python via pip-audit over the pinned env; JS/extension via npm audit (committed lockfiles). pdfjs/
    # pdf-lib parse untrusted attacker PDFs, so a high/critical advisory must block, not just be logged.
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.detect.outputs.has_py == 'true'
        with:
          python-version: "3.11"
      - name: pip-audit (openOM's pinned runtime deps - informational)
        if: needs.detect.outputs.has_py == 'true'
        run: |
          python -m pip install --upgrade pip pip-audit
          # Audit constraints.lock (openOM's DECLARED pinned deps), not the whole env (which carries
          # ambient pip/setuptools/wheel this project neither ships nor depends on). pip-audit hits the
          # LIVE advisory DB, so a newly-published transitive advisory with no fix yet would otherwise
          # block every unrelated PR - surface it, let Dependabot PR the bump. The hard supply-chain
          # gate below is the SHIPPED artifact (the npm bundle), which is deterministic.
          echo "::group::pip-audit (advisory)"
          pip-audit -r constraints.lock --desc || echo "::warning::pip-audit found advisories - triage + Dependabot"
          echo "::endgroup::"
      - uses: actions/setup-node@v4
        if: needs.detect.outputs.has_js == 'true'
        with:
          node-version: "20"
      - name: npm audit - SHIPPED deps block on high/critical; dev tooling is informational
        if: needs.detect.outputs.has_js == 'true'
        shell: bash
        run: |
          npm --prefix js ci
          npm --prefix extension ci
          # The gate: what actually ships to users (the npm package + the extension bundle) must have
          # zero high/critical advisories. Dev-only test tooling (vitest/vite) is surfaced but not
          # blocking - Dependabot PRs those upgrades on its own schedule.
          npm --prefix js audit --omit=dev --audit-level=high
          npm --prefix extension audit --omit=dev --audit-level=high
          echo "::group::dev-dependency advisories (informational)"
          npm --prefix js audit --audit-level=high || true
          npm --prefix extension audit --audit-level=high || true
          echo "::endgroup::"

  javascript:
    needs: detect
    if: needs.detect.outputs.has_js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck + lint + coverage js
        working-directory: js
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run coverage
      - name: Build the embeddable badge widget + assert it is inference-free (#144)
        working-directory: js
        run: npm run build:widget

  action:
    # Exercise the openom-embed GitHub Action end-to-end (#145) against locally-built packages
    # (install: false), so its action.yml wiring is proven before any PyPI release.
    needs: detect
    if: needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local core + cli (stand in for the PyPI packages)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e core -e cli
      - name: check - a valid payload passes (strict)
        uses: ./.github/actions/openom-embed
        with:
          command: check
          payload: spec/samples/valid-stnl.json
          schema: spec/om-0.1.schema.json
          strict: "true"
          install: "false"
      - name: embed - produce an openOM PDF
        uses: ./.github/actions/openom-embed
        with:
          command: embed
          pdf: spec/vectors/pdfs/sample-stnl.pdf
          payload: spec/samples/valid-stnl.json
          out: out.openom.pdf
          asserted-date: "2026-08-18"
          install: "false"
      - name: check - the embedded PDF round-trips
        uses: ./.github/actions/openom-embed
        with:
          command: check
          input: out.openom.pdf
          schema: spec/om-0.1.schema.json
          install: "false"

  cross-impl:
    # The anti-fork oracle: each implementation reads the other's golden PDFs.
    needs: [detect, python, javascript]
    if: needs.detect.outputs.has_js == 'true' && needs.detect.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install both toolchains
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e "core[dev]"
          cd js && npm ci && npm run build
      - name: JS side - read Track A goldens (A->B) + emit JS-embedded PDFs (B->A)
        run: node js/scripts/crossimpl.mjs "$RUNNER_TEMP/ximpl"
      - name: Python side - read JS-embedded PDFs (B->A) + byte-identity
        run: pytest core -q -m cross_impl
        env:
          OPENOM_XIMPL_DIR: ${{ runner.temp }}/ximpl

  # The live headed-Chromium extension gate and mutation testing are LOCAL/manual gates, not CI jobs:
  # headed MV3 Chromium crashes deterministically under the GitHub-hosted xvfb env, and mutation runs
  # are long. Both are run locally before a release and documented in CONTRIBUTING.md "Verification
  # gates" (#163, #164). The deterministic anti-fork jobs above are the automated proof.
