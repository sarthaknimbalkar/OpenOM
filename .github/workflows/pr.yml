name: pr

# Lightweight, auto-running gate for pull requests + pushes to main: lint, types, and the fast unit
# suites on a single runner. The HEAVY gate (full OS x Python matrix, cross-impl anti-fork oracle,
# headed-browser live gates, the Action e2e) stays in ci.yml, run manually / on demand. This keeps
# contributor PRs checked and the README badge meaningful without the matrix cost on every push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + cli + mcp, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.lock -e "core[dev]" -e "cli[dev]" -e "mcp[dev]"
      - name: ruff
        run: ruff check core/src core/tests core/scripts cli/src cli/tests mcp/src mcp/tests spec/matrix.py spec/__init__.py spec/tests spec/scripts
      - name: mypy
        run: |
          (cd core && mypy)   # each package's own [tool.mypy] (strict + overrides)
          (cd cli && mypy)
          (cd mcp && mypy)
      - name: tests (env-gated integration/cross-impl auto-skip)
        run: python -m pytest core cli mcp spec -q  # -m adds cwd to sys.path (spec/ import in test_matrix)

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: js - typecheck + lint + coverage
        working-directory: js
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run coverage
      - name: js - build widget + freshness guard (deployed artifact matches source)
        working-directory: js
        run: |
          npm run build:widget
          node scripts/check-widget-artifact.mjs
      - name: extension - unit + build + inference-free (headed live gates stay in ci.yml)
        working-directory: extension
        run: |
          npm ci
          npm run test:unit
          npm run build
          npm run assert-no-inference
