# Root ruff config for repo files outside a package (spec/ tooling). The core/cli/mcp packages
# carry their own [tool.ruff] in their pyproject.toml (ruff uses the nearest config per file).
line-length = 100

[lint]
select = ["E", "F", "I", "B", "UP", "W"]

[lint.per-file-ignores]
# gen_docs.py / gen_site.py emit static HTML + CSS; wrapping literal <pre>, long links, and minified
# CSS rules would corrupt output or hurt readability. (Both are pure HTML generators, not logic.)
"spec/scripts/gen_docs.py" = ["E501"]
"spec/scripts/gen_site.py" = ["E501"]
