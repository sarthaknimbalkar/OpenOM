# Root ruff config for repo files outside a package (spec/ tooling). The core/cli/mcp packages
# carry their own [tool.ruff] in their pyproject.toml (ruff uses the nearest config per file).
line-length = 100

[lint]
select = ["E", "F", "I", "B", "UP", "W"]

[lint.per-file-ignores]
# gen_docs.py emits static HTML/URLs; wrapping literal <pre> and long links would corrupt output.
"spec/scripts/gen_docs.py" = ["E501"]
