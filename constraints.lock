# openOM reproducible dependency pin (M2 #12).
# Libraries keep semver FLOORS in their pyproject.toml (right for consumers); this file pins the
# exact known-good transitive closure for the release/app layer. CI installs with
#   pip install -c constraints.lock -e core -e cli -e mcp
# so builds are reproducible. As a constraints file, unused pins (e.g. pywin32 off-Windows) are
# ignored. Regenerate after an intentional dependency bump:
#   python -m pip freeze --exclude-editable | grep -viE '^openom|@ file|^-e ' | sort > constraints.lock
