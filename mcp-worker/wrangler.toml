name = "openom-mcp"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Bundling: the ajv standalone validator (validator.cjs) requires ajv runtime helpers; pdfjs-dist is
# only a dynamic encrypted-PDF fallback in openom-js and is not shipped to the Worker (encrypted OMs
# return an "encrypted" state instead). Everything else in the read/validate path is pure JS.
[build]
command = "node scripts/gen-validator.mjs"

[observability]
enabled = true

# Per-client rate limit for the open, unauthenticated public endpoint (no KV needed - CF's native
# Rate Limiting binding). 120 requests / 60s per client IP; over → 429 + Retry-After. Enforced in
# prod where the binding is provisioned; absent in local tests (the code guards on its presence).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Privacy-preserving aggregate usage (the adoption flywheel). Records per tool call: tool name,
# result state, and a salted 16-bit host bucket - never the client IP, URL, full domain, or payload.
# See src/usage.ts. Absent locally/self-host, where the recorder is a no-op.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "openom_usage"
