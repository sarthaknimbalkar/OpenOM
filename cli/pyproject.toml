[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openom-cli"
version = "0.1.0.dev0"
description = "openOM CLI — the `om` command over openom-core. Zero inference."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openom-core", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
om = "openom_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openom_cli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["openom_cli"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__"]
