[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openom-mcp"
version = "0.1.0.dev0"
description = "openOM MCP server — deterministic tool surface over openom-core. Zero inference, ever."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openom-core", "mcp>=2.0", "httpx>=0.27", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5", "boto3>=1.34", "moto[s3]>=5"]
r2 = ["boto3>=1.34"]  # S3BlobStore (R2) adapter — runtime extra for a real deployment

[project.scripts]
om-mcp = "openom_mcp.server:main"
om-mcp-http = "openom_mcp.server:main_http"

[tool.hatch.build.targets.wheel]
packages = ["src/openom_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "pymupdf", "pymupdf.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["openom_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__"]
